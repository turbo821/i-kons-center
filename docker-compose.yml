services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: infocenter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL-скрипты выполняются один раз при первой инициализации БД.
      # Чтобы перезапустить инициализацию: docker compose down -v
      - ./db/scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infocenter"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: flask_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      # Загружаемые пользователем CSV/Excel — отдельный volume,
      # не теряются при пересборке контейнера
      - uploads_data:/app/uploads
    environment:
      # Подключение к БД
      # База данных
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-infocenter}
      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # Пути
      UPLOAD_FOLDER: /app/uploads
      # Admin bootstrap
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # Режим работы
      FLASK_ENV: ${FLASK_ENV:-production}
      GUNICORN_ENABLED: ${GUNICORN_ENABLED:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      # Flask
      FLASK_APP: run.py
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: react_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
